name: pairing

on:
  pull_request:
    paths:
      - src/pairing.rs
      - tests/pairing.rs
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/pairing.yml
  push:
    branches:
      - main
    paths:
      - src/pairing.rs
      - tests/pairing.rs
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/pairing.yml

jobs:
  macos-pairing:
    runs-on: macos-26
    env:
      TMPDIR: /tmp
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --test pairing
      - run: |
          for attempt in {1..30}; do
            cargo test --locked --test pairing concurrent_exchanges_cannot_redeem_the_same_code_twice -- --exact
          done
