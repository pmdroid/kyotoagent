name: ci

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: |
          printf '%s\n' 'abi <abi/4.0>,' 'profile kyoto-bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' '}' | sudo tee /etc/apparmor.d/kyoto-bwrap
          sudo apparmor_parser -r /etc/apparmor.d/kyoto-bwrap
          bwrap --bind / / true
      - run: python3 -m unittest discover -s evals -p 'test_*.py'
      - run: python3 scripts/verify.py all --online
