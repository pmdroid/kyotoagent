specVersion: '0.1'
retry:
  maxFailedAttemptsPerItem: 3
  scope: task
items:
  - id: cargo-test
    kind: command
    gate: beforePR
    exec: [python3, scripts/verify.py, test]
    timeoutSeconds: 1920
  - id: cargo-fmt
    kind: command
    gate: beforePR
    exec: [python3, scripts/verify.py, fmt]
    timeoutSeconds: 840
  - id: cargo-clippy
    kind: command
    gate: beforePR
    exec: [python3, scripts/verify.py, clippy]
    timeoutSeconds: 1620
